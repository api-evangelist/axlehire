gaps:
- >-
  No registry distribution. Vendoring a zip means no semver resolution, no
  dependency locking, no transitive security advisories and no automated
  upgrade path — the single largest integration-friction item in Jitsu's
  developer surface.
- No public source repository for any SDK; the zip is the only artifact.
