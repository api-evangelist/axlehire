source: https://docs.gojitsu.com/#/docs/SDKs.md
description: >-
  Jitsu (formerly AxleHire) publishes nine first-party SDKs covering the v3 REST
  API. They are NOT on any language package registry — each ships as a zip
  archive downloaded from the docs host and vendored into the consuming project.
  Every download URL below was fetched and returned HTTP 200 application/zip on
  2026-08-06; the size observed is recorded. Jitsu's own note: "SDK source is
  distributed as a zip archive. Future releases will be published to
  language-native package registries (PyPI, npm, Packagist, RubyGems, etc.)."
  Registry lookups for jitsu-sdk on npm and PyPI returned 404, confirming this.
distribution: zip-archive
