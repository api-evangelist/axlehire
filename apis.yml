aid: axlehire
name: AxleHire (Jitsu)
description: >-
  AxleHire is a US last-mile delivery carrier founded in 2015 that rebranded as
  Jitsu in April 2024 and now operates at gojitsu.com. It runs an asset-light,
  gig-driver network with a proprietary routing and tracking platform serving
  e-commerce, meal-kit and subscription-box shippers across 23 of the 25 largest
  US metros, seven days a week. The Jitsu REST API (v3) lets shippers submit
  shipments, retrieve ZPL/PNG/PDF labels, manage parcels, cancel and re-window
  deliveries, pull rating estimates and proof-of-delivery, and read the full
  tracking event history. A documented webhook surface pushes ~33 lifecycle
  events — planning, inbound scan, outbound pickup/dropoff, proof-of-delivery
  and exceptions — to a registered endpoint. Jitsu publishes an OpenAPI 3.0.1
  contract, nine first-party SDKs, a staging environment with a lifecycle
  simulation API, and a public status page.
