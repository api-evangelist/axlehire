    x-issued-at: https://client.gojitsu.com/ (Settings → API Token)
    x-staging-issued-at: https://client.staging.gojitsu.com/
    x-scopes: none — a token carries full account permissions
    x-self-service: false
    x-detail: ../authentication/axlehire-authentication.yml

- target: $.paths['/v3/shipments'].post
  description: >-
    Flag the duplicate-creation risk on the one required operation in the whole
    integration.
  update:
    x-idempotent: false
    x-retry-safe: false
    x-natural-keys: [internal_id, tracking_code]
    x-agentic-access:
      action_class: write
      consequence: irreversible-side-effect
      note: >-
        Creates a real physical delivery and incurs cost. Not safe to retry
        blind; confirm via GET /v3/shipments/{shipment_id} before re-issuing.

- target: $.paths['/v3/shipments/{shipment_id}/cancel'].post
  description: Mark the consequence class of cancellation.
  update:
    x-agentic-access:
      action_class: write
      consequence: irreversible-side-effect
      note: >-
        Produces CANCELLED_BEFORE_PICKUP or CANCELLED_AFTER_PICKUP depending on
        timing; cannot be undone by the API.

- target: $.paths['/v3/shipments/{shipment_id}/label'].get
  description: Record the label formats and the response encoding, which the contract does not state.
  update:
    x-formats: [PDF, PNG, ZPL]
    x-default-format: PDF
    x-response-encoding: base64 string in the `label` field
    x-source: https://docs.gojitsu.com/#/docs/Labels.md

- target: $.tags
  description: >-
    Note the tag/route inconsistency — a "Partner Information" tag is used on
    /v3/partner/tracking/{tracking_code}/events but is not declared in tags[],
    and two operations share the operationId `retrieveEvents`.
  update:
    x-tag-issues:
      undeclared_tags: [Partner Information]
      duplicate_operation_ids:
      - operationId: retrieveEvents
        paths:
        - '/v3/tracking/{tracking_code}/events'
        - '/v3/partner/tracking/{tracking_code}/events'
      note: >-
        Duplicate operationIds break code generation — most generators either
        collide or silently drop one of the two methods.
