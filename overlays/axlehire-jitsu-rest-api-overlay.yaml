- target: $
  description: Record the idempotency posture explicitly — the contract is silent, the docs are not.
  update:
    x-idempotency:
      supported: false
      mechanism: none
      guidance: >-
        Jitsu publishes no Idempotency-Key header. A retried POST /v3/shipments
        after a timeout can create a duplicate shipment. The documented
        mitigation is to send a stable internal_id or tracking_code and to look
        the shipment up before retrying.
      source: https://docs.gojitsu.com/#/docs/RetryAndErrors.md

- target: $.components.securitySchemes.Authorization
