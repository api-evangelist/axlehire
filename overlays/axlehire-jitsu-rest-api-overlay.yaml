  update:
    x-rate-limits:
      limit: 10
      metric: requests_per_second
      scope: account
      environments: [production, staging]
      throttle_status: 429
      response_headers: none
      backoff: exponential 1s/2s/4s/8s capped at 60s with 10-20% jitter
