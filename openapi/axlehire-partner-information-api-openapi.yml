components:
  schemas:
    TrackingEvent:
      title: Tracking Event
      type: object
      properties:
        shipment_id:
          type: integer
        ts:
          type: string
          format: date-time
          description: Timestamp as a ISO-8601 string
        geolocation:
          $ref: '#/components/schemas/Geolocation'
        signal:
          type: string
          description: ' Shipment event'
          example: DROPOFF_SUCCEEDED
        eta:
          type: integer
          example: 12000
          description: Estimated time of arrival
        remark:
          type: string
          description: Remark provided by driver
        next_destination:
          type: string
          example: DROP_OFF
          description: Next planned destination type
        type:
          type: string
          description: Event category
          example: OUTBOUND
    Geolocation:
      title: Geolocation
      type: object
      properties:
        latitude:
          type: number
          format: float
          example: 33.90218024032627
        longitude:
          type: number
          format: float
          example: -118.04558467543646
        altitude:
          type: number
          format: float
          example: 26.378598849334196
      description: Coordinate based location
  securitySchemes:
    Authorization:
      name: Authorization
      type: apiKey
      in: header
      description: '**Authorization header for all calls in format: ''Authorization : Token {YOUR_TOKEN}''**'
