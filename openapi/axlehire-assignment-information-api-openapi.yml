        timezone:
          type: string
          readOnly: true
        actual_arrival_ts:
          type: string
          format: date-time
          readOnly: true
        delivery_items:
          type: string
        warehouse_id:
          type: integer
          readOnly: true
        display_status:
          type: string
          readOnly: true
        asap:
          type: boolean
          readOnly: true
        late:
          type: boolean
          readOnly: true
        rdi:
          type: string
        warehouse_facility_id:
          type: string
          readOnly: true
        inbound_status:
          type: string
          readOnly: true
        service_level:
          type: string
          description: NEXT_DAY, SAME_DAY, STANDARD
        dropoff_access_code:
          type: string
        dropoff_additional_instruction:
          type: string
          readOnly: true
        extra:
          type: object
          description: 'Additional information '
          additionalProperties:
            type: object
        region_code:
          type: string
          readOnly: true
        code:
          type: string
          description: Brand code as set in portal
    Address:
      type: object
      properties:
        street:
          type: string
        street2:
          type: string
        city:
          type: string
        state:
          type: string
        zipcode:
          type: string
        what3words:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      description: An address is a structured entity that contains address components
      x-examples:
        Example 1:
          street: 1937 Davis Street
          street2: Suite A
          city: San Leandro
          state: CA
          zipcode: '94577'
    Weight:
      type: object
      x-examples:
        Example 1:
          value: 1.5
          unit: lb
      description: Parcel weight
      properties:
        value:
          type: number
          format: double
        unit:
          type: string
    Parcel:
      type: object
      properties:
