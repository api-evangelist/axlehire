        internal_id:
          type: string
        order_detail:
          type: string
          readOnly: true
        pickup_address:
          $ref: '#/components/schemas/Address'
        pickup_note:
          type: string
        pickup_earliest_ts:
          type: string
          format: date-time
        pickup_latest_ts:
          type: string
          format: date-time
        pickup_buffer:
          type: integer
          format: int32
        dropoff_address:
          $ref: '#/components/schemas/Address'
        dropoff_earliest_ts:
          type: string
          format: date-time
        dropoff_latest_ts:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
          readOnly: true
        dropoff_buffer:
          type: integer
          format: int32
        dropoff_note:
          type: string
        delivery_proof_photo_required:
          type: boolean
        sms_enabled:
          type: boolean
        signature_required:
          type: boolean
        id_required:
          type: boolean
        assignment_id:
          type: integer
          readOnly: true
        is_cancelled:
          type: boolean
          readOnly: true
        tracking_url:
          type: string
          readOnly: true
        tracking_code:
          type: string
        remark:
