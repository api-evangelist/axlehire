openapi: 3.2.0
info:
  title: Jitsu REST Assignment Information API
  description: 'The Jitsu API allows clients to submit shipments, retrieve shipment details and labels, track delivery events, and manage the full shipment lifecycle programmatically.


    **Authentication**


    All requests require a token in the `Authorization` header:

    ```

    Authorization: Token YOUR_API_TOKEN

    ```

    Generate your token in the Client Portal under Settings → API Token.


    **Typical Shipment Lifecycle**


    `CREATED` → `GEOCODED` → `ASSIGNED` → `PICKUP_EN_ROUTE` → `PICKED_UP` → `DROPOFF_EN_ROUTE` → `DELIVERED`


    See the [Integration Guide](https://docs.gojitsu.com) for the full lifecycle, webhook events, and error handling reference.


    For questions or integration support, contact [api@gojitsu.com](mailto:api@gojitsu.com).'
  contact:
    name: Jitsu API Support
    email: api@gojitsu.com
    url: https://gojitsu.com
  version: 3.0.0
servers:
- url: https://api.staging.gojitsu.com
  description: Staging
- url: https://api.gojitsu.com
  description: Production
security:
- Authorization: []
tags:
- name: Assignment Information
  description: Assignment specific calls
paths:
  /v3/assignments/{assignment_id}:
    get:
      summary: Retrieve Assignment
      description: Get an assignment by its id
      operationId: retrieve
      parameters:
      - name: assignment_id
        description: Assignment ID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AssignmentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                Example:
                  value:
                    id: <ASSIGNMENT_ID>
                    driver:
                      name: Jason Statham
                      phone_number: '123456789'
                      profile_photo: https://someExpirableUrl.com
                    vehicle:
                      make: Audi
                      model: S8
                      color: Black
                      license_plate: CA 6XRT009
                    shipment_ids:
                    - <SHIPMENT_ID_1>
                    - <SHIPMENT_ID_2>
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
              examples:
                Example:
                  value:
                    id: 0
                    driver:
                      name: Jason Statham
                      phone_number: '123456789'
                      profile_photo: https://someExpirableUrl.com
                    vehicle:
                      make: Ford
                      model: Fiesta
                      color: Silver
                      license_plate: CA 6XRT009
                    shipment_ids:
                    - 0
                    - 1
      tags:
      - Assignment Information
  /v3/assignments/{assignment_id}/shipments:
    get:
      summary: Retrieve Shipments by Assignment
      description: Get shipments for an assignmentId
      operationId: retrieveShipments
      parameters:
      - name: assignment_id
        description: Assignment ID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AssignmentId'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
              examples:
                Example:
                  value:
                  - id: 11111
                    internal_id: '123'
                    workload: 0
                    customer:
                      name: John Doe
                      phone_number: 123-456-7890
                      email: john.d@example.com
                    status: CREATED
                    pickup_address:
                      street2: Suite A
                      street: 1937 Davis Street
                      city: San Leandro
                      state: CA
                      zipcode: '94577'
                      lat: 0
                      lng: 0
                    pickup_earliest_ts: '2018-10-13T15:36:50.052Z'
                    pickup_latest_ts: '2018-10-13T16:23:50.052Z'
                    pickup_note: 'Parking lot #3'
                    pickup_buffer: 300
                    dropoff_address:
                      street2: Suite A
                      street: 1937 Davis Street
                      city: Berkeley
                      state: CA
                      zipcode: '94577'
                      lat: 0
                      lng: 0
                    dropoff_earliest_ts: '2018-10-13T17:36:50.052Z'
                    dropoff_latest_ts: '2018-10-14T17:23:50.052Z'
                    dropoff_note: Please leave at the door, do not ring the bell!
                    dropoff_buffer: 360
                    delivery_proof_photo_required: false
                    signature_required: true
                    sms_enabled: true
                    assignment_id: 0
                    is_cancelled: false
                    tracking_code: JITSU_UNIQUE_CODE_123 (auto-generated most of the time)
                    tracking_url: https://recipient.gojitsu.com/xyz789
                    rdi: COMMERCIAL
                    remark:
                      pickup: pickup remark left by driver/dispatcher if any
                      dropoff: dropoff remark left by driver/dispatcher if any
                      return: return remark left by driver/dispatcher if any
                    parcels:
                    - dimensions:
                        unit: in
                        height: 10
                        width: 15
                        length: 25
                      weight:
                        value: 1
                        unit: lb
        2XX:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
              examples:
                Example:
                  value:
                  - id: 0
                    internal_id: '123'
                    workload: 0
                    customer:
                      name: John Doe
                      phone_number: 123-456-7890
                      email: john.d@example.com
                    status: CREATED
                    pickup_address:
                      street2: Suite A
                      street: 1937 Davis Street
                      city: San Leandro
                      state: CA
                      zipcode: '94577'
                      lat: 0
                      lng: 0
                    pickup_earliest_ts: '2018-10-13T15:36:50.052Z'
                    pickup_latest_ts: '2018-10-13T16:23:50.052Z'
                    pickup_note: 'Parking lot #3'
                    pickup_buffer: 300
                    dropoff_address:
                      street2: Suite A
                      street: 1937 Davis Street
                      city: Berkeley
                      state: CA
                      zipcode: '94577'
                      lat: 0
                      lng: 0
                    dropoff_earliest_ts: '2018-10-13T17:36:50.052Z'
                    dropoff_latest_ts: '2018-10-14T17:23:50.052Z'
                    dropoff_note: Please leave at the door, do not ring the bell!
                    dropoff_buffer: 360
                    delivery_proof_photo_required: false
                    signature_required: true
                    sms_enabled: true
                    assignment_id: 0
                    is_cancelled: false
                    tracking_code: JITSU_UNIQUE_CODE_123 (auto-generated most of the time)
                    tracking_url: https://recipient.gojitsu.com/xyz789
                    rdi: COMMERCIAL
                    remark:
                      pickup: pickup remark left by driver/dispatcher if any
                      dropoff: dropoff remark left by driver/dispatcher if any
                      return: return remark left by driver/dispatcher if any
                    parcels:
                    - dimensions:
                        unit: in
                        height: 10
                        width: 15
                        length: 25
                      weight:
                        value: 1
                        unit: lb
      tags:
      - Assignment Information
components:
  schemas:
    Driver:
      type: object
      properties:
        first_name:
          type: string
          example: James
        last_name:
          type: string
          example: Bond
        phone_number:
          type: string
          example: '1234567890'
          description: US phone number
        profile_photo:
          type: string
        id:
          type: integer
    Dimension:
      type: object
      description: Size of parcel typically using height, width, and length
      x-examples:
        Example 1:
          unit: in
          height: 5.5
          width: 2
          length: 3
          depth: 4.2
      properties:
        unit:
          type: string
          default: in
          example: kg
        height:
          type: number
          format: double
        width:
          type: number
          format: double
        length:
          type: number
          format: double
        depth:
          type: number
          format: double
    Phone-Number:
      title: Phone-Number
      type: string
      example: '1234567865'
      description: 10 digit phone number
    Assignment:
      type: object
      description: Delivery assignment
      properties:
        id:
          type: integer
        driver:
          $ref: '#/components/schemas/Driver'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        shipment_ids:
          type: array
          items:
            type: integer
    Vehicle:
      type: object
      description: Driver vehicle
      properties:
        make:
          type: string
          example: Aston Martin
        model:
          type: string
          example: DB5
        color:
          type: string
          example: Silver
        license_plate:
          type: string
          example: BND-007
        license_plate_state:
          type: string
          example: CA
        id:
          type: integer
    Shipment:
      type: object
      x-examples:
        example-1:
          id: -9223372036854776000
          customer:
            name: string
            email: string
            phone_number: string
          workload: -1.7976931348623157e+308
          tags:
          - string
          status: DRAFT
          price:
            unit: string
            base: 0
            pre_delivery_adjustment: 0
            post_delivery_adjustment: 0
          parcels:
          - id: string
            description: string
            dimensions:
              unit: enum
              height: 0
              width: 0
              length: 0
              depth: 0
            weight:
              value: 0
              unit: enum
            category: string
            type: string
            status: string
            quantity: 0
            _created: '2019-08-24T14:15:22Z'
            _updated: '2019-08-24T14:15:22Z'
            _deleted: true
            _etag: string
            uid: string
            shipment_id: 0
            parcel_id: string
          items:
          - id: string
            description: string
            dimensions:
              unit: string
              height: 0
              width: 0
              length: 0
              depth: 0
            weight:
              value: 0
              unit: string
            category: string
            type: string
            status: string
            quantity: 0
            _created: '2019-08-24T14:15:22Z'
            _updated: '2019-08-24T14:15:22Z'
            _deleted: true
            _etag: string
            uid: string
            shipment_id: 0
            parcel_id: string
          actualDepartureTs: '2019-08-24T14:15:22Z'
          internal_id: string
          order_detail: string
          pickup_address:
            street: string
            street2: string
            city: string
            state: string
            zipcode: string
            latitude: 0
            longitude: 0
          pickup_note: string
          pickup_earliest_ts: '2019-08-24T14:15:22Z'
          pickup_latest_ts: '2019-08-24T14:15:22Z'
          pickup_buffer: -2147483648
          dropoff_address:
            street: string
            street2: string
            city: string
            state: string
            zipcode: string
            latitude: 0
            longitude: 0
          dropoff_earliest_ts: '2019-08-24T14:15:22Z'
          dropoff_latest_ts: '2019-08-24T14:15:22Z'
          created: '2019-08-24T14:15:22Z'
          dropoff_buffer: -2147483648
