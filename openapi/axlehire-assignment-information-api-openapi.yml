          type: integer
          description: Jitsu Parcel Identifier
        description:
          type: string
        dimensions:
          $ref: '#/components/schemas/Dimension'
        weight:
          $ref: '#/components/schemas/Weight'
        category:
          type: string
          readOnly: true
        type:
          type: string
          description: Type of parcel
          example: box
          readOnly: true
        status:
          type: string
          readOnly: true
        quantity:
          type: integer
          format: int32
        _created:
          type: string
          format: date-time
          readOnly: true
        _updated:
          type: string
          format: date-time
          readOnly: true
        _deleted:
          type: boolean
          readOnly: true
        _etag:
          type: string
          readOnly: true
        uid:
          type: string
          readOnly: true
        shipment_id:
          type: integer
        parcel_id:
          type: string
          description: Client internal parcel identifier
          example: abc123
    Email:
      title: Email
      type: string
      example: john.doe@test.com
      description: Properly formatted email address
    AssignmentId:
      title: AssignmentId
      type: integer
      example: 7890
      readOnly: true
      description: Unique identifier for delivery assignment
    Remark:
      type: object
      properties:
        pickup:
          type: string
        dropoff:
          type: string
        return:
          type: string
    Customer:
      type: object
      x-examples:
        John Doe:
          name: John Doe
          email: john.d@example.com
          phone_number: 123-456-7890
      description: A customer represents the essential information we should know about your customer or the recipient.
      required:
      - name
      properties:
        name:
          type: string
        email:
          $ref: '#/components/schemas/Email'
        phone_number:
          $ref: '#/components/schemas/Phone-Number'
  securitySchemes:
    Authorization:
      name: Authorization
      type: apiKey
      in: header
      description: '**Authorization header for all calls in format: ''Authorization : Token {YOUR_TOKEN}''**'
