    ParcelId:
      title: ParcelId
      type: integer
      description: Unique Jitsu identifier for Parcel
      example: 1234
      readOnly: true
    AssignmentId:
      title: AssignmentId
      type: integer
      example: 7890
      readOnly: true
      description: Unique identifier for delivery assignment
    Email:
      title: Email
      type: string
      example: john.doe@test.com
      description: Properly formatted email address
    Phone-Number:
      title: Phone-Number
      type: string
      example: '1234567865'
      description: 10 digit phone number
    TrackingEvent:
      title: Tracking Event
      type: object
      properties:
        shipment_id:
          type: integer
        ts:
          type: string
          format: date-time
          description: Timestamp as a ISO-8601 string
        geolocation:
          $ref: '#/components/schemas/Geolocation'
        signal:
          type: string
          description: ' Shipment event'
          example: DROPOFF_SUCCEEDED
        eta:
          type: integer
          example: 12000
          description: Estimated time of arrival
        remark:
          type: string
          description: Remark provided by driver
        next_destination:
          type: string
          example: DROP_OFF
          description: Next planned destination type
        type:
          type: string
          description: Event category
          example: OUTBOUND
    Geolocation:
      title: Geolocation
      type: object
      properties:
        latitude:
          type: number
          format: float
          example: 33.90218024032627
        longitude:
          type: number
          format: float
          example: -118.04558467543646
        altitude:
          type: number
          format: float
          example: 26.378598849334196
      description: Coordinate based location
    WebhookEventData:
      title: WebhookEventData
      type: object
      description: Shipment update information formatted for webhook varying by event
      properties:
        reason_code:
          type: string
          description: Reason provided by driver
          example: No access code
        shipment:
          $ref: '#/components/schemas/MiniShipment'
        assignment:
          $ref: '#/components/schemas/MiniAssignment'
        ts_local:
          type: string
          format: date-time
          description: Localized timestamp as a ISO-8601 string
        eta:
          type: number
          example: 12000
          description: Estimated time of arrival in milliseconds
        destination:
          type: string
          description: Destination city and state
          example: 'San Franciso, CA'
        old_data:
          type: object
          description: Previous values of updated fields
        updated_fields:
          type: array
          description: Array of fields updated
          items:
            type: string
            example: assignment_id
        new_data:
          type: object
          description: New values for updated fields
        source:
          type: string
          description: Event origin
          example: AP_inbound_api
        delayed_reason:
          type: string
          description: Delay reason
    MiniShipment:
      title: MiniShipment
      type: object
      description: 'Consolidated shipment identifying information '
      properties:
        shipment_id:
          type: integer
        internal_id:
          type: string
          description: Your unique identifier of the shipment
          example: abc123
        tracking_code:
          type: string
          description: Tracking code for shipment
          example: tracking123
        assignment_id:
          type: integer
        store_id:
          type: string
          example: '876'
          description: Unique identifier of original pickup store if applicable
        remark:
          $ref: '#/components/schemas/Remark'
    MiniAssignment:
      title: MiniAssignment
      type: object
      description: Summarized delivery assignment information
      properties:
        id:
          $ref: '#/components/schemas/AssignmentId'
        driver:
          $ref: '#/components/schemas/Driver'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        shipment_ids:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentId'
    Webhook:
      title: Webhook
      type: object
      description: Real time update for shipment
      properties:
        event:
          type: string
          description: Event type
        ts:
          type: string
          format: date-time
          description: Timestamp as ISO-8601 string
        geolocation:
          $ref: '#/components/schemas/Geolocation'
        data:
          $ref: '#/components/schemas/WebhookEventData'
  securitySchemes:
    Authorization:
      name: Authorization
      type: apiKey
      in: header
      description: '**Authorization header for all calls in format: ''Authorization : Token {YOUR_TOKEN}''**'
security:
  - Authorization: []
